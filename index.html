<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://drive.google.com/file/d/1IvWGBTuxfeZ5i5BeZptRdR6axqHMIHOC/view?usp=sharing">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AdityaVat Recruitment Console</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f5f4f1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    src=""
    allow="clipboard-read; clipboard-write">
  </iframe>

  <script>
    const APPS_SCRIPT_BASE_URL = "https://script.google.com/macros/s/AKfycby-IM3coZunylbsUiV3QUF-HeF1MyTvvAz-srK0hyrtpj98ASmxD56QnlhIMIhzAzvx/exec";
    const currentParams = window.location.search;
    document.getElementById('appFrame').src = APPS_SCRIPT_BASE_URL + currentParams;
  </script>
</body>
</html>
